<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adv. Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="calstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    
</head>

<body class="">

    <div class="container-fluid hero-container">
        <div class="container main-container dark">
            <div class="row toggle-area">
                <div class="col theme-change">
                    <div class="theme-style dark">
                        <div class="sun-icon">
                            <i class="fa-solid icon fa-sun"></i>
                        </div>
                        <div class="moon-icon highlight">
                            <i class="fa-solid icon fa-moon"></i>
                        </div>
                    </div>
                </div>

                <div class="col name">
                    <div class="heading-style dark">
                        <h3>AdvCalculator</h3>
                    </div>
                </div>

                <div class="col history-button">
                    <div class="more-button dark">
                        <i class="fa-solid icon fa-ellipsis"></i>
                            <div class="dropdown">
                                <h3 id="mode" class="dark">Mode</h3>
                            </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div clas="col input-area">
                    <h1 id="display"></h1>
                </div>
                <div class="col ans-area">
                    <h1 id="answer"></h1>
                </div>
            </div>

            <div class="row row-cols-4 gy-2 buttons-hero">

                <div class="col special-key">
                    <div class="buttons" id="sin">
                        <h1>sin</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="cos">
                        <h1>cos</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="tan">
                        <h1>tan</h1>
                    </div>
                </div>
                <div class="col special-key">
                    <div class="buttons" id="rad">
                        <h1>rad</h1>
                    </div>
                </div>
                <div class="col special-key">
                    <div class="buttons" id="deg">
                        <h1>deg</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="log">
                        <h1>log</h1>
                    </div>
                </div>
                <div class="col special-key">
                    <div class="buttons" id="in">
                        <h1>In</h1>
                    </div>
                </div>
                <div class="col special-key">
                    <div class="buttons">
                        <h1>(</h1>
                    </div>
                </div>
                <div class="col special-key">
                    <div class="buttons">
                        <h1>)</h1>
                    </div>
                </div>
                <div class="col special-key">
                    <div class="buttons" id="square">
                        <h1>x²</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="factorial">
                        <h1>!</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark clearAll">
                        <h1>AC</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>%</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark backSpace">
                        <h1>⌫</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>÷</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="power">
                        <h1>^</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>7</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>8</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>9</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>×</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="sqrt">
                        <h1>√</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>4</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>5</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>6</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>-</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="pie">
                        <h1>π</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>1</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>2</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>3</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>+</h1>
                    </div>
                </div>

                <div class="col special-key">
                    <div class="buttons" id="euler">
                        <h1>e</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>00</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>0</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="buttons dark">
                        <h1>.</h1>
                    </div>
                </div>
                <div class="col">
                    <div class="speButon equal">
                        <h1 id="equalTo">=</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="logic.js"></script>
</body>

</html>
